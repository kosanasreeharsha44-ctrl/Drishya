<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14142B" />
      <stop offset="100%" stop-color="#07070D" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7B5CFF" />
      <stop offset="100%" stop-color="#FF2E9A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Stylized 'D' contour -->
  <path
    d="M 140 110 L 250 110 C 350 110 400 170 400 256 C 400 342 350 402 250 402 L 140 402 Z"
    fill="none"
    stroke="url(#neonGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Eye Shape inside the D (Drishya = Vision / Sight) -->
  <path
    d="M 185 256 C 220 205 280 205 315 256 C 280 307 220 307 185 256 Z"
    fill="none"
    stroke="#00E5FF"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pupil / Lens -->
  <circle cx="250" cy="256" r="24" fill="#FF2E9A" />
  <circle cx="258" cy="248" r="8" fill="#FFFFFF" />
</svg>
